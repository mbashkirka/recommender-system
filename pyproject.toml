[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-lab"
version = "1.0.2"
description = "Production-oriented recommender systems pet project with offline evaluation and A/B experimentation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Mikhail Bashkirov"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
recsys = "recsys_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
